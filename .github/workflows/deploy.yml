name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify, build, and upload
        uses: withastro/action@v6
        with:
          node-version: "24"
          package-manager: pnpm@12.14.0
          build-cmd: pnpm verify
        env:
          SITE_URL: https://astra-chanuwu.github.io
          BASE_PATH: /astro-chan-blog
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
